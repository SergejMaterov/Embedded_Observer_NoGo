name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest
      - name: Full numerical checks (Appendix A of the paper)
        run: python embedded_observer_checks.py > /dev/null
      - name: Checks corollary 7.5.py
        run: embedded_observer_checks_corollary75.py > /dev/null
